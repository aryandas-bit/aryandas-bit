<svg viewBox="0 0 640 360" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" role="img" aria-label="A pigeon coding in a neon editor that types itself out">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#10171f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bb3a3"/>
      <stop offset="50%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bb3a3"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2bb3a3" opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- typing clips: each rect wipes left→right, holds, then clears on loop -->
    <clipPath id="t1"><rect x="84" y="142" width="0" height="20"><animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.04;0.12;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="84" y="166" width="0" height="20"><animate attributeName="width" values="0;0;220;220;0" keyTimes="0;0.13;0.21;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t3"><rect x="84" y="190" width="0" height="20"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;0.22;0.30;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t4"><rect x="84" y="214" width="0" height="20"><animate attributeName="width" values="0;0;230;230;0" keyTimes="0;0.31;0.39;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t5"><rect x="84" y="238" width="0" height="20"><animate attributeName="width" values="0;0;30;30;0" keyTimes="0;0.40;0.46;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t6"><rect x="84" y="266" width="0" height="20"><animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.47;0.58;0.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="640" height="360" rx="18" fill="url(#bg)"/>
  <rect width="640" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="300" cy="220" rx="290" ry="150" fill="url(#halo)"/>

  <!-- code window -->
  <g filter="url(#shadow)">
    <rect x="56" y="92" width="424" height="232" rx="14" fill="#0b1119" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <rect x="56" y="92" width="424" height="232" rx="14" fill="none" stroke="#1d2733" stroke-width="1"/>
  </g>
  <!-- title bar -->
  <circle cx="82" cy="114" r="5.5" fill="#ff5f56"/>
  <circle cx="102" cy="114" r="5.5" fill="#ffbd2e"/>
  <circle cx="122" cy="114" r="5.5" fill="#27c93f"/>
  <text x="240" y="118" fill="#3b4756" font-size="12" text-anchor="middle">pigeon.ts</text>
  <line x1="56" y1="128" x2="480" y2="128" stroke="#1d2733" stroke-width="1"/>

  <!-- code, revealed line-by-line via clip -->
  <g font-size="15.5" font-weight="500">
    <g clip-path="url(#t1)"><text x="84" y="157"><tspan fill="#c792ea">const</tspan><tspan fill="#82aaff"> pigeon</tspan><tspan fill="#89ddff"> =</tspan><tspan fill="#5b6776"> {</tspan></text></g>
    <g clip-path="url(#t2)"><text x="104" y="181"><tspan fill="#f78c6c">role</tspan><tspan fill="#5b6776">:</tspan><tspan fill="#c3e88d"> "CX + AI ops"</tspan><tspan fill="#5b6776">,</tspan></text></g>
    <g clip-path="url(#t3)"><text x="104" y="205"><tspan fill="#f78c6c">stack</tspan><tspan fill="#5b6776">: [</tspan><tspan fill="#c3e88d">"TS","Node","React"</tspan><tspan fill="#5b6776">],</tspan></text></g>
    <g clip-path="url(#t4)"><text x="104" y="229"><tspan fill="#f78c6c">ship</tspan><tspan fill="#5b6776">: () </tspan><tspan fill="#c792ea">=&gt;</tspan><tspan fill="#82aaff"> deploy</tspan><tspan fill="#5b6776">(),</tspan></text></g>
    <g clip-path="url(#t5)"><text x="84" y="253"><tspan fill="#5b6776">}</tspan></text></g>
    <g clip-path="url(#t6)"><text x="84" y="281"><tspan fill="#c792ea">while</tspan><tspan fill="#5b6776"> (awake) </tspan><tspan fill="#82aaff">pigeon</tspan><tspan fill="#5b6776">.</tspan><tspan fill="#ffcb6b">code</tspan><tspan fill="#5b6776">()</tspan></text></g>
  </g>

  <!-- blinking caret -->
  <rect x="240" y="268" width="9" height="17" fill="#2bb3a3">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== minimal pigeon mascot perched on the window ===== -->
  <g transform="translate(404 26)" filter="url(#shadow)">
    <!-- feet -->
    <line x1="44" y1="60" x2="44" y2="68" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="60" x2="56" y2="68" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>

    <!-- tail -->
    <path d="M70 40 L 112 28 L 106 50 L 72 52 Z" fill="#5d6876"/>

    <!-- body -->
    <ellipse cx="52" cy="42" rx="28" ry="23" fill="#9aa6b4"/>
    <!-- folded iridescent wing -->
    <path d="M44 30 C 28 32 28 56 52 60 C 70 57 72 38 60 30 Z" fill="url(#plume)"/>
    <path d="M40 40 C 50 42 62 44 66 40" stroke="#0e141d" stroke-width="1" fill="none" opacity="0.25"/>
    <path d="M40 48 C 50 50 60 51 64 48" stroke="#0e141d" stroke-width="1" fill="none" opacity="0.25"/>

    <!-- head (gentle bob to the beat) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 34 38; 3 34 38; -3 34 38" dur="1.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <circle cx="32" cy="22" r="17" fill="#aab4c0"/>
      <!-- beak -->
      <path d="M16 22 L 2 25 L 16 30 Z" fill="#f5a623"/>
      <!-- glasses -->
      <circle cx="30" cy="20" r="7" fill="#0b1119" fill-opacity="0.55" stroke="#1c2430" stroke-width="2.5"/>
      <line x1="37" y1="20" x2="44" y2="22" stroke="#1c2430" stroke-width="2.5"/>
      <circle cx="30" cy="20" r="2.4" fill="#2bb3a3"/>
      <!-- headphone -->
      <path d="M18 12 A 18 18 0 0 1 48 14" fill="none" stroke="#2a2f3a" stroke-width="5" stroke-linecap="round"/>
      <rect x="14" y="16" width="11" height="20" rx="5.5" fill="#7928CA"/>
    </g>

    <!-- little music notes from the headphones -->
    <g fill="#2bb3a3" font-size="13" font-weight="700">
      <text x="-6" y="4">♪<animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="4;-10" dur="2.2s" begin="0s" repeatCount="indefinite"/></text>
      <text x="-14" y="14" fill="#7928CA">♫<animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="14;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- footer status -->
  <text x="320" y="346" text-anchor="middle" fill="#3b4756" font-size="11">// shipping fixes &amp; vibing — aryandas-bit</text>
</svg>
