<svg viewBox="0 0 820 240" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated messenger pigeon carrying an envelope">
  <defs>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bb3a3"/>
      <stop offset="55%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa6b4"/>
      <stop offset="100%" stop-color="#5d6876"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e75b6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0e75b6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow that drifts with the bird -->
  <ellipse cx="410" cy="120" rx="260" ry="70" fill="url(#glow)">
    <animateTransform attributeName="transform" type="translate"
      values="-120 0; 120 0; -120 0" dur="9s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
  </ellipse>

  <!-- sparkle dust trail -->
  <g fill="#7928CA">
    <circle cx="250" cy="90" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="150" r="2.5" fill="#2bb3a3"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="80" r="2.5" fill="#0e75b6"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="160" r="3"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- whole pigeon: gentle horizontal glide + vertical bob -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-90 6; 90 -6; -90 6" dur="9s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

    <g transform="translate(410 120)">
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 0 -10; 0 0" dur="2.2s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

        <!-- FAR wing (behind body) -->
        <g transform="translate(-6 -16)">
          <path d="M0 0 C -55 -8 -95 22 -120 60 C -70 44 -28 36 0 22 Z" fill="#4a5562">
            <animateTransform attributeName="transform" type="rotate"
              values="-26 0 0; 30 0 0; -26 0 0" dur="0.9s" repeatCount="indefinite"
              calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
          </path>
        </g>

        <!-- tail -->
        <path d="M-48 4 C -96 -2 -120 10 -140 24 C -116 26 -92 30 -54 26 Z" fill="#6c7785"/>

        <!-- body -->
        <ellipse cx="0" cy="6" rx="58" ry="36" fill="#8a96a3"/>
        <!-- iridescent breast / neck -->
        <path d="M30 -14 C 58 -8 64 22 44 36 C 22 30 14 2 30 -14 Z" fill="url(#neck)"/>

        <!-- head -->
        <circle cx="52" cy="-20" r="25" fill="#9aa6b4"/>
        <!-- eye -->
        <circle cx="62" cy="-24" r="4.5" fill="#1c2430"/>
        <circle cx="63.5" cy="-25.5" r="1.4" fill="#ffffff"/>
        <!-- beak -->
        <path d="M74 -20 L 96 -16 L 74 -10 Z" fill="#f5a623"/>

        <!-- dangling envelope (the "message") -->
        <g transform="translate(36 44)">
          <animateTransform attributeName="transform" type="rotate"
            values="-6 0 -28; 6 0 -28; -6 0 -28" dur="2.2s" repeatCount="indefinite"
            calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"
            additive="sum"/>
          <line x1="0" y1="-30" x2="0" y2="-4" stroke="#5d6876" stroke-width="2"/>
          <rect x="-20" y="-4" width="40" height="28" rx="3" fill="#ffffff" stroke="#0e75b6" stroke-width="2"/>
          <path d="M-20 -2 L 0 12 L 20 -2" fill="none" stroke="#0e75b6" stroke-width="2"/>
        </g>

        <!-- NEAR wing (in front) - big flap -->
        <g transform="translate(-2 -14)">
          <path d="M0 0 C -52 -14 -92 14 -112 56 C -64 40 -24 34 4 18 Z" fill="url(#wing)">
            <animateTransform attributeName="transform" type="rotate"
              values="32 0 0; -24 0 0; 32 0 0" dur="0.9s" repeatCount="indefinite"
              calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
          </path>
        </g>
      </g>
    </g>
  </g>
</svg>
