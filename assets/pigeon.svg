<svg viewBox="0 0 560 320" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated pigeon coding on a laptop">
  <defs>
    <linearGradient id="neck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2bb3a3"/>
      <stop offset="55%" stop-color="#7928CA"/>
      <stop offset="100%" stop-color="#0e75b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2330"/>
      <stop offset="100%" stop-color="#0e141d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="280" cy="150" rx="250" ry="120" fill="url(#glow)"/>

  <!-- floating code symbols rising -->
  <g font-family="Fira Code, monospace" font-weight="700" font-size="20">
    <text x="120" y="120" fill="#2bb3a3">&lt;/&gt;
      <animate attributeName="y" values="120;70" dur="4s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="430" y="130" fill="#7928CA">{ }
      <animate attributeName="y" values="130;78" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="120" fill="#0e75b6">;
      <animate attributeName="y" values="120;76" dur="4s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" begin="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ===== PIGEON (behind the laptop) ===== -->
  <g>
    <!-- body -->
    <ellipse cx="280" cy="190" rx="78" ry="92" fill="#8a96a3"/>
    <!-- iridescent breast -->
    <path d="M280 130 C 322 140 326 215 280 248 C 234 215 238 140 280 130 Z" fill="url(#neck)" opacity="0.92"/>

    <!-- head group: bobs to the music -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="-2.5 280 150; 2.5 280 150; -2.5 280 150" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>

      <circle cx="280" cy="92" r="48" fill="#9aa6b4"/>
      <!-- beak -->
      <path d="M280 104 L 292 116 L 280 124 L 268 116 Z" fill="#f5a623"/>

      <!-- glasses -->
      <g stroke="#1c2430" stroke-width="4" fill="#11151c" fill-opacity="0.35">
        <circle cx="262" cy="86" r="16"/>
        <circle cx="298" cy="86" r="16"/>
        <line x1="278" y1="86" x2="282" y2="86"/>
      </g>
      <!-- eyes behind glasses -->
      <circle cx="262" cy="86" r="4.5" fill="#1c2430"/>
      <circle cx="298" cy="86" r="4.5" fill="#1c2430"/>
      <circle cx="263.5" cy="84.5" r="1.4" fill="#fff"/>
      <circle cx="299.5" cy="84.5" r="1.4" fill="#fff"/>

      <!-- headphones -->
      <path d="M232 78 A 48 52 0 0 1 328 78" fill="none" stroke="#2a2f3a" stroke-width="8" stroke-linecap="round"/>
      <rect x="222" y="78" width="20" height="34" rx="9" fill="#7928CA"/>
      <rect x="318" y="78" width="20" height="34" rx="9" fill="#7928CA"/>
    </g>
  </g>

  <!-- ===== LAPTOP ===== -->
  <!-- screen -->
  <rect x="192" y="170" width="176" height="104" rx="9" fill="#2a313d"/>
  <rect x="200" y="178" width="160" height="88" rx="5" fill="url(#screen)"/>

  <!-- code lines (type on, then clear, looping) -->
  <g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      <rect x="212" y="190" width="30" height="7" rx="3" fill="#7928CA"/>
      <rect x="248" y="190" width="48" height="7" rx="3" fill="#0e75b6"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="0.7s" repeatCount="indefinite"/>
      <rect x="226" y="204" width="24" height="7" rx="3" fill="#2bb3a3"/>
      <rect x="256" y="204" width="58" height="7" rx="3" fill="#8a96a3"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="1.4s" repeatCount="indefinite"/>
      <rect x="226" y="218" width="40" height="7" rx="3" fill="#f5a623"/>
      <rect x="272" y="218" width="30" height="7" rx="3" fill="#2bb3a3"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="2.1s" repeatCount="indefinite"/>
      <rect x="240" y="232" width="52" height="7" rx="3" fill="#7928CA"/>
      <rect x="298" y="232" width="24" height="7" rx="3" fill="#0e75b6"/>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" begin="2.8s" repeatCount="indefinite"/>
      <rect x="212" y="246" width="30" height="7" rx="3" fill="#8a96a3"/>
    </g>
    <!-- blinking cursor -->
    <rect x="248" y="246" width="7" height="8" fill="#2bb3a3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- keyboard base -->
  <path d="M168 274 L 392 274 L 416 300 L 144 300 Z" fill="#5d6876"/>
  <path d="M168 274 L 392 274 L 388 280 L 172 280 Z" fill="#717d8c"/>
  <ellipse cx="280" cy="289" rx="26" ry="4" fill="#48515d"/>

  <!-- ===== WINGS typing on the keyboard (front-most) ===== -->
  <g transform="translate(212 270)">
    <path d="M0 0 C -22 -2 -34 14 -30 30 C -10 24 14 18 22 6 Z" fill="#6c7785">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 5; 0 0" dur="0.5s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </path>
  </g>
  <g transform="translate(348 270)">
    <path d="M0 0 C 22 -2 34 14 30 30 C 10 24 -14 18 -22 6 Z" fill="#6c7785">
      <animateTransform attributeName="transform" type="translate"
        values="0 5; 0 0; 0 5" dur="0.5s" begin="0s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </path>
  </g>

  <!-- ===== COFFEE MUG with steam ===== -->
  <g transform="translate(438 250)">
    <g stroke="#2bb3a3" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8">
      <path d="M0 -8 C -6 -16 6 -22 0 -32">
        <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      </path>
      <path d="M12 -8 C 6 -16 18 -22 12 -32">
        <animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
      </path>
    </g>
    <path d="M-12 0 L 22 0 L 18 26 L -8 26 Z" fill="#ffffff" stroke="#0e75b6" stroke-width="2.5"/>
    <path d="M22 4 C 36 4 36 22 20 20" fill="none" stroke="#0e75b6" stroke-width="2.5"/>
  </g>
</svg>
